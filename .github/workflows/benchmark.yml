name: Benchmark

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      agents:
        description: "Comma-separated agents"
        default: "autohand,pi,codex,cline"
      providers:
        description: "Comma-separated providers"
        default: "openrouter"
      model:
        description: "Model id for the selected provider(s)"
        default: "openrouter/free"
      rounds:
        description: "Cold/warm pairs per (agent x provider)"
        default: "3"

# Serialize runs so the gh-pages data branch never races with itself.
concurrency: benchmark

permissions:
  contents: write # push the accumulated results + dashboard to the gh-pages branch

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      # Only the secrets you configure are exercised; unset providers report `blocked`.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # Make the project-local agent CLIs (pi, cline) discoverable on PATH.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Doctor (report available credentials and agents)
        run: bun run benchmark doctor --json || true

      - name: Run benchmark
        run: |
          bun run benchmark run \
            --agents "${{ inputs.agents || 'autohand,pi,codex,cline' }}" \
            --providers "${{ inputs.providers || 'openrouter' }}" \
            --model "${{ inputs.model || 'openrouter/free' }}" \
            --rounds "${{ inputs.rounds || '3' }}"

      - name: Publish dashboard to gh-pages
        run: |
          set -euo pipefail
          git config user.name "benchmark-bot"
          git config user.email "benchmark-bot@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages
            (cd gh-pages && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi
          mkdir -p gh-pages/results
          cp -R results/run-* gh-pages/results/ 2>/dev/null || true
          bun run benchmark dashboard --results gh-pages/results --output gh-pages/index.html
          touch gh-pages/.nojekyll
          # Force-add: the repo .gitignore excludes results/, but on gh-pages the
          # accumulated report.json files are the data source and must be tracked.
          (cd gh-pages && git add -Af . && git commit -m "benchmark ${GITHUB_RUN_ID}" || echo "no changes to publish")
          (cd gh-pages && git push origin HEAD:gh-pages)

      # Fallback distribution: the built dashboard is always downloadable from the run,
      # even if GitHub Pages is not enabled for this private repo's plan.
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: gh-pages/index.html
          if-no-files-found: warn
