name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # proof = tests + strict typecheck + lint + offline doctor. No secrets, no model calls.
      - run: bun run proof
